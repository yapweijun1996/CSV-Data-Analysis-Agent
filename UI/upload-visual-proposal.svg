<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title description">
  <title id="title">Proposal: mobile CSV upload screen visual anchor</title>
  <desc id="description">A proposed 390 by 844 mobile upload screen based on the supplied baseline. It is a design anchor, not an implemented application screenshot.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #172238; }
      .muted { fill: #40536f; }
      .subtle { fill: #61758f; }
      .blue { fill: #2563eb; }
    </style>
  </defs>

  <!-- Screen surface and existing top bar -->
  <rect width="390" height="844" fill="#f7f9fc"/>
  <text x="12" y="34" class="body" font-size="18" font-weight="700">AI Analysis</text>

  <!-- Header actions retain the baseline icon-only mobile treatment and 44px targets. -->
  <g aria-label="History">
    <rect x="238" y="6" width="44" height="44" rx="5" fill="#ffffff" stroke="#c8d4e3"/>
    <circle cx="260" cy="28" r="7" fill="none" stroke="#3b4d68" stroke-width="1.8"/>
    <path d="M260 23.5v4.8l3.1 1.8" fill="none" stroke="#3b4d68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g aria-label="Data Explorer">
    <rect x="286" y="6" width="44" height="44" rx="5" fill="#f1f5f9" stroke="#c8d4e3"/>
    <path d="m299.5 23-4 5 4 5M316.5 23l4 5-4 5M311 21.5l-4 13" fill="none" stroke="#91a2ba" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g aria-label="Assistant">
    <rect x="334" y="6" width="44" height="44" rx="5" fill="#2563eb"/>
    <path d="M350 23.5a6 6 0 0 1 11.2 3c0 3.3-2.7 5.8-6 5.8a6.4 6.4 0 0 1-3-.7l-3.3 1 .9-3a5.7 5.7 0 0 1 .2-6.1Z" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="354.5" cy="27" r=".8" fill="#ffffff"/>
    <circle cx="358.6" cy="27" r=".8" fill="#ffffff"/>
  </g>

  <!-- Upload surface -->
  <rect x="13" y="69" width="364" height="762" rx="11" fill="#f8fafc" stroke="#cbd7e5" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Existing empty-state upload icon -->
  <g fill="none" stroke="#96a7bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="181" y="231" width="28" height="32" rx="4"/>
    <path d="M195 239v16M187 247h16"/>
  </g>

  <text x="195" y="302" text-anchor="middle" class="body" font-size="20" font-weight="700">Upload a CSV to begin</text>
  <text x="195" y="329" text-anchor="middle" class="muted" font-size="12.5" font-weight="400">We will recognize the fields, check data quality, then build</text>
  <text x="195" y="347" text-anchor="middle" class="muted" font-size="12.5" font-weight="400">an analysis you can explore by asking questions.</text>

  <text x="195" y="381" text-anchor="middle" class="subtle" font-size="16" font-weight="500">Drag &amp; drop your CSV file here</text>
  <text x="195" y="404" text-anchor="middle" class="muted" font-size="12">or</text>

  <!-- Main upload action enlarged to a 44px target -->
  <rect x="143" y="417" width="104" height="44" rx="11" fill="#2563eb"/>
  <text x="195" y="444" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Select a file</text>

  <!-- Existing HDB demo callout and action -->
  <rect x="51" y="477" width="288" height="136" rx="10" fill="#eff6ff" stroke="#d5e5ff"/>
  <text x="195" y="505" text-anchor="middle" class="muted" font-size="11.5">Stress-test with every official HDB resale</text>
  <text x="195" y="523" text-anchor="middle" class="muted" font-size="11.5">record from 1990 onward. Source values are</text>
  <text x="195" y="541" text-anchor="middle" class="muted" font-size="11.5">not pre-cleaned.</text>
  <rect x="92" y="556" width="206" height="44" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="195" y="583" text-anchor="middle" class="blue" font-size="12" font-weight="700">Load Full Raw HDB Data</text>

  <!-- Existing privacy/provider notice -->
  <text x="195" y="640" text-anchor="middle" class="muted" font-size="12">CSV processing is mainly local. Approved prompts,</text>
  <text x="195" y="655" text-anchor="middle" class="muted" font-size="12">card samples, and query results are sent to your</text>
  <text x="195" y="670" text-anchor="middle" class="muted" font-size="12">selected AI provider.</text>
</svg>
