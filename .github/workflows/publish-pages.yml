name: Publish verified GitHub Pages site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify artifact preparation
        run: node --test scripts/stage-pages-artifact.test.mjs
      - name: Install frontend dependencies
        # --ignore-scripts skips the optional onnxruntime-node native download; the browser build does not use it.
        run: npm ci --prefix frontend --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build production site (writes frontend/dist and its SHA256SUMS.txt)
        run: npm run build
      - name: Stage checksum-verified site files
        run: node scripts/stage-pages-artifact.mjs frontend/dist pages-artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact

  deploy:
    needs: stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
